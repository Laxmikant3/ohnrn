# WindIQ web container — complete nginx configuration.
#
# This file is installed as /etc/nginx/nginx.conf (not a conf.d snippet) because
# the container runs unprivileged (uid 10002). The stock nginx.conf writes its
# pid to /run/nginx.pid, which is root-owned inside the image and makes the
# worker fail with "open() /run/nginx.pid failed (13: Permission denied)".
# Keeping pid and all temp paths under /tmp makes the image start as non-root.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Writable temp locations for the unprivileged user.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        charset utf-8;

        # Security headers. The app has no inline scripts beyond the Vite bundle,
        # so a reasonably strict policy is safe.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # Lightweight container healthcheck endpoint.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Immutable, content-hashed build assets.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Proxy the versioned API to the backend service. The service name `api`
        # matches docker-compose.yml; for a single-container deployment override
        # this upstream with an API_BASE_URL-aware reverse proxy in front of the app.
        #
        # The upstream is a variable resolved through Docker's embedded DNS at
        # request time. That keeps `nginx -t` working during the image build
        # (where no `api` container exists yet) and picks up a new API container
        # IP after a redeploy instead of pinning the address at startup.
        location /api/ {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
            proxy_connect_timeout 10s;
        }

        # SPA fallback: every unknown path is handled by React Router.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Never cache the shell so route updates are picked up immediately.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}
